<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>微机与单片机 · 极速刷题宝</title>
    <meta name="description" content="基于 React + shadcn/ui + Lucide 图标库的单片机与微机原理刷题应用，涵盖 320 题真题考点与 C51 源码精解。" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.5'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />

    <!-- 提前应用主题，避免深色模式下的白屏闪烁 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mcu_quiz_settings_v2');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else if (theme === 'green') document.documentElement.classList.add('green');
        } catch (e) {}
      })();
    </script>

    <!-- 首屏骨架：内联样式 + 内联结构，不依赖 JS 与外部 CSS，HTML 到达即绘制 -->
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #fff; }
      html.dark body { background: #09090b; }
      html.green body { background: #f4f8f3; }
      .sk {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        background: #fff; color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      html.dark .sk { background: #09090b; color: #fafafa; }
      html.green .sk { background: #f4f8f3; color: #1b2b1d; }
      .sk-head {
        height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
        border-bottom: 1px solid #e4e4e7;
      }
      html.dark .sk-head { border-color: #27272a; }
      html.green .sk-head { border-color: #dce7da; }
      .sk-logo { width: 28px; height: 28px; border-radius: 8px; background: #18181b; flex: none; }
      html.dark .sk-logo { background: #fafafa; }
      html.green .sk-logo { background: #2f6b3a; }
      .sk-brand { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
      .sk-mode { margin-left: auto; display: flex; gap: 4px; background: #f4f4f5; padding: 3px; border-radius: 10px; }
      html.dark .sk-mode { background: #27272a; }
      html.green .sk-mode { background: #e6efe3; }
      .sk-mode span { width: 44px; height: 26px; border-radius: 7px; background: #fff; display: block; }
      html.dark .sk-mode span { background: #3f3f46; }
      .sk-icons { display: flex; gap: 8px; margin-left: 8px; }
      .sk-icons i { width: 22px; height: 22px; border-radius: 6px; background: #f1f1f3; display: block; }
      html.dark .sk-icons i { background: #27272a; }
      .sk-stats { display: flex; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #f1f1f3; }
      html.dark .sk-stats { border-color: #1f1f23; }
      .sk-main { flex: 1; padding: 12px; }
      .sk-card {
        max-width: 896px; margin: 0 auto; border: 1px solid #e4e4e7; border-radius: 16px;
        padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff;
      }
      html.dark .sk-card { background: #09090b; border-color: #27272a; }
      html.green .sk-card { background: #fbfdfa; border-color: #dce7da; }
      .sk-line, .sk-opt {
        border-radius: 8px;
        background: linear-gradient(90deg, #f4f4f5 25%, #e9e9ec 37%, #f4f4f5 63%);
        background-size: 400% 100%;
        animation: sk-shimmer 1.4s ease infinite;
      }
      html.dark .sk-line, html.dark .sk-opt {
        background: linear-gradient(90deg, #1c1c20 25%, #27272a 37%, #1c1c20 63%);
        background-size: 400% 100%;
      }
      .sk-line { height: 10px; }
      .sk-line.w20 { width: 20%; }
      .sk-line.w30 { width: 30%; }
      .sk-line.w40 { width: 40%; }
      .sk-line.w55 { width: 55%; }
      .sk-line.w80 { width: 80%; }
      .sk-line.tall { height: 18px; }
      .sk-opt { height: 52px; }
      @keyframes sk-shimmer {
        0% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-line, .sk-opt { animation: none; }
      }
      .sk-sr {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk" role="status" aria-live="polite" aria-busy="true">
        <span class="sk-sr">正在加载 320 道题目…</span>
        <header class="sk-head">
          <div class="sk-logo"></div>
          <div class="sk-brand">刷题宝</div>
          <div class="sk-mode"><span></span><span></span></div>
          <div class="sk-icons"><i></i><i></i><i></i></div>
        </header>
        <div class="sk-stats">
          <div class="sk-line w40"></div>
          <div class="sk-line w20"></div>
        </div>
        <main class="sk-main">
          <div class="sk-card">
            <div class="sk-line w30"></div>
            <div class="sk-line w80 tall"></div>
            <div class="sk-line w55 tall"></div>
            <div class="sk-opt"></div>
            <div class="sk-opt"></div>
            <div class="sk-opt"></div>
            <div class="sk-opt"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
